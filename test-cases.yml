- summary: |
 Проверка функциональности раздела Упражнения
 requirement: |
 Раздел Упражнения должен обеспечивать:
 - Создание новых упражнений
 - Управление существующими упражнениями
 - Валидацию входных данных
 - Отображение списка упражнений
 prerequisites: |
 - Пользователь зарегистрирован на сайте
 - Выполнен вход в систему
 test-data: |
 Credentials:
 Email: registereduser@example.com
 Пароль: RegisteredPassword123
 Exercise Details:
 Название: Проверка статуса
 Сложность: Легкая
 Язык: Java
 Описание: "Напишите метод на Java, который принимает булево значение и возвращает строку 'Активно', если значение true, и 'Неактивно', если false"
 Примеры:
 - Ввод: true, Вывод: Активно
 - Ввод: false, Вывод: Неактивно
 - Ввод: true, Вывод: Активно
 steps:
 - Открываем сайт
 - Переходим к странице входа
 - Вводим email: registereduser@example.com
 - Вводим пароль: RegisteredPassword123
 - Нажимаем кнопку «Войти»
 - Открываем меню профиля на главной странице
 - Нажимаем на пункт «Упражнения»
 - Проверяем наличие разделов:
 - Создать упражнение
 - Пул упражнений
 - Переходим в раздел «Создать упражнение»
 - Заполняем форму создания упражнения:
 - В поле «Название» вводим: Проверка статуса
 - Выбираем сложность: Легкая
 - Выбираем язык: Java
 - Вводим описание
 - Добавляем входные/выходные параметры
 - Добавляем примеры
 - Нажимаем кнопку «Создать»
 - Проверяем создание упражнения:
 - Упражнение появляется в списке
 - Все данные корректно отображаются
 - Переходим в раздел «Пул упражнений»
 - Проверяем наличие созданного упражнения
 expected-result: |
 - Форма создания упражнения доступна
 - Все поля формы валидируются корректно
 - Упражнение успешно создается
 - Данные упражнения корректно отображаются
 - Упражнение появляется в пуле упражнений
 - Примеры тестов работают корректно

- summary: |
 Проверка функциональности создания турнира по программированию
 requirement: |
 Функционал создания турнира должен обеспечивать:
 - Создание турнира в командном режиме
 - Указание параметров турнира
 - Валидацию входных данных
 - Сохранение настроек турнира
 - Отображение турнира в списке
 prerequisites: |
 - Пользователь зарегистрирован на сайте
 - Выполнен вход в систему
 - У пользователя есть права на создание турниров
 test-data: |
 Credentials:
 Email: adminuser@example.com
 Пароль: AdminPassword123
 Tournament Details:
 Название: Кубок кодинга
 Тип: Командный
 Команды:
 - Команда Alpha
 - Команда Beta
 Описание: "Турнир между двумя командами. Задачи средней сложности."
 Время начала: "2023-11-15T14:00:00Z"
 Настройки:
 Доступ: По токену
 Ход игры: Случайный раунд
 Оценка игры: Выиграл или проиграл
 Источник упражнений: Пул упражнений
 Сложность: Средний
 Количество игроков: 64
 Язык: Java
 Timeout: 600 секунд
 Перерыв: 300 секунд
 Раунды до победы: 3
 steps:
 - Открываем сайт
 - Переходим к странице входа
 - Вводим email: adminuser@example.com
 - Вводим пароль: AdminPassword123
 - Нажимаем кнопку «Войти»
 - Открываем меню профиля
 - Нажимаем на пункт «Турниры»
 - Заполняем форму создания турнира:
 - Вводим название: Кубок кодинга
 - Выбираем тип: Командный
 - Добавляем имена команд
 - Вводим описание
 - Устанавливаем время начала
 - Выбираем настройки доступа
 - Настраиваем ход игры
 - Настраиваем оценку игры
 - Выбираем источник упражнений
 - Устанавливаем сложность
 - Указываем количество игроков
 - Выбираем язык программирования
 - Устанавливаем таймаут
 - Указываем длительность перерыва
 - Настраиваем раунды до победы
 - Нажимаем кнопку «Создать»
 - Проверяем создание турнира:
 - Турнир отображается в списке
 - Открываем детальную информацию
 - Проверяем корректность всех параметров
 expected-result: |
 - Форма создания турнира доступна
 - Все поля валидируются корректно
 - Турнир успешно создается
 - Настройки корректно сохраняются
 - Турнир отображается в списке
 - Детальная информация соответствует введенным данным

- summary: |
 Проверка работы формы обратной связи
 requirement: |
 Форма обратной связи должна обеспечивать:
 - Выбор категории обращения
 - Ввод текстового сообщения
 - Валидацию обязательных полей
 - Отправка данных на сервер
 - Отображение результата отправки
 prerequisites: |
 - Пользователь находится на странице с формой обратной связи
 - Форма доступна для взаимодействия
 test-data: |
 Категория: "Улучшения"
 Текст сообщения: "Предлагаю добавить возможность фильтрации задач по сложности"
 steps:
 - Открываем сайт
 - Переходим на страницу с формой обратной связи
 - Проверяем наличие обязательных полей:
 - Категория обращения
 - Поле для текста
 - Кнопка отправки
 - Выбираем категорию "Улучшения" из выпадающего списка
 - Вводим текст сообщения
 - Нажимаем кнопку "Отправить"
 - Проверяем появление подтверждающего сообщения
 expected-result: |
 - Форма загружается без ошибок
 - Все поля доступны для ввода
 - Сообщение успешно отправляется
 - Появляется подтверждающее сообщение
 - Данные в форме очищаются
