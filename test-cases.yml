---
- summary: |
    Проверка регистрации нового пользователя с уникальным email и паролем
  requirement: |
    Пользователи могут регистрироваться на сайте с использованием уникального email и пароля
  prerequisites: |
    Открыта страница регистрации
  test-data: |
    Email = newuser@example.com Пароль = NewPassword123
  steps:
    - Вводим email newuser@example.com
    - Вводим пароль NewPassword123
    - Подтверждаем пароль NewPassword123
    - Нажимаем кнопку «Зарегистрироваться»
  expected-result: |
    Пользователь успешно зарегистрирован и перенаправлен на страницу входа или профиля
    
- summary: |
    Проверка входа на сайт через учетные данные Git или Discord
  requirement: |
    Пользователи могут авторизоваться на сайте с использованием внешних провайдеров аутентификации (Git или Discord).
  prerequisites: |
    - Открыта страница входа
    - У пользователя есть учетная запись Git или Discord
    - На странице входа присутствуют кнопки 'Войти через Git' и 'Войти через Discord'
  test-data: |
    Git:
      - Имя пользователя: gituser123
      - Пароль: GitPassword456
    Discord:
      - Токен авторизации: discord_token_1234567890abcdef
  steps:
    - Открываем сайт и переходим к странице входа
    - Выбираем способ входа:
      - Вариант 1: Нажимаем кнопку «Войти через Git»
      - Вариант 2: Нажимаем кнопку «Войти через Discord»
    - Для Git:
      - Вводим имя пользователя: gituser123
      - Вводим пароль: GitPassword456
      - Нажимаем кнопку «Авторизоваться»
    - Для Discord:
      - В модальном окне разрешаем приложению доступ к данным аккаунта Discord
      - Подтверждаем авторизацию
    - После успешной авторизации проверяем:
      - Перенаправление на главную страницу
      - Отображение имени пользователя или аватара
  expected-result: |
    - Пользователь успешно авторизован через выбранный провайдер (Git или Discord)
    - Перенаправление на главную страницу сайта
    - На главной странице отображается имя пользователя или его аватар
    - Сессия пользователя активна
    - Возможность взаимодействия с сайтом
    
- summary: |
    Проверка запуска игры авторизованным пользователем
  requirement: |
    Авторизованные пользователи могут запустить игру:
    - с главной страницы
    - из раздела игр
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему
    - Пользователь находится на главной странице
    - На странице присутствует кнопка "Create Game"
  test-data: |
    Credentials:
      Email: registereduser@example.com
      Пароль: RegisteredPassword123
    Game settings:
      Game Name: "Название_Игры"
      Level: Medium
      Game Mode: Bot
      Time Control: 10 минут
      Task: Tomato
  steps:
    - Открываем сайт
    - Переходим к странице входа
    - Вводим email: registereduser@example.com
    - Вводим пароль: RegisteredPassword123
    - Нажимаем кнопку «Войти»
    - На главной странице находим и нажимаем кнопку "Create Game"
    - В выпадающем списке "Level" выбираем значение "Medium"
    - В секции "Game Mode" выбираем режим "Bot"
    - В поле "Time Control" устанавливаем значение "10 минут"
    - В модальном окне "Task" выбираем тематику "Tomato"
    - Нажимаем кнопку «Create Battle» для выбранной игры
    - Проверяем:
      - Корректность отображения игрового интерфейса
      - Работу игрового поля
      - Отображение счета
      - Работу таймера
  expected-result: |
    - Игра успешно загружается и начинается в браузере
    - Интерфейс игры отображается корректно, без технических ошибок
    - Настройки игры соответствуют выбранным параметрам:
      - Сложность: Medium
      - Режим: Bot
      - Время: 10 минут
      - Тематика: Tomato
    - Все элементы управления доступны и работают корректно

- summary: |
    Проверка работы чата на главной странице
  requirement: |
    Чат на главной странице должен обеспечивать:
    - Обмен текстовыми сообщениями
    - Отображение статусов пользователей
    - Отправка файлов
    - Уведомления о новых сообщениях
    - Корректное отображение сообщений
  prerequisites: |
    - Пользователь зарегистрирован
    - Выполнен вход в систему
    - Открыта главная страница
    - Чат виден на странице
  test-data: |
    Credentials:
      Email: registereduser@example.com
      Пароль: RegisteredPassword123
    Message: "Привет, это тестовое сообщение!"
  steps:
    - Открываем сайт
    - Переходим к странице входа
    - Вводим email: registereduser@example.com
    - Вводим пароль: RegisteredPassword123
    - Нажимаем кнопку «Войти»
    - Проверяем наличие чата на странице:
      - Чат виден
      - Поле ввода сообщений присутствует
      - Кнопка отправки активна
    - Кликаем на поле ввода сообщения
    - Вводим текст: "Привет, это тестовое сообщение!"
    - Отправляем сообщение (кнопка «Отправить» или Enter)
    - Проверяем отображение сообщения:
      - Сообщение появляется в чате
      - Текст отображается корректно
      - Видна временная метка
      - Отображается аватар отправителя
      - Статус сообщения меняется на "Прочитано"
  expected-result: |
    - Чат успешно загружен
    - Все элементы интерфейса активны
    - Сообщение успешно отправлено:
      - Текст соответствует отправленному
      - Временная метка корректна
      - Аватарка отображается
      - Статус сообщения обновляется
    - Чат работает без ошибок
    
- summary: |
    Проверка функциональности раздела Профиль
  requirement: |
    Раздел Профиль должен обеспечивать:
      - Просмотр персональной информации пользователя
      - Корректное отображение всех данных профиля
      - Возможность редактирования профиля
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему
  test-data: |
    Credentials:
      Email: registereduser@example.com
      Пароль: RegisteredPassword123
  steps:
    - Открываем сайт
    - Переходим к странице входа
    - Вводим email: registereduser@example.com
    - Вводим пароль: RegisteredPassword123
    - Нажимаем кнопку «Войти»
    - Открываем меню профиля на главной странице
    - Нажимаем на пункт «Мой профиль»
    - Проверяем отображение следующих данных:
      - Фото профиля
      - Имя пользователя
      - Дата регистрации
      - Ранг
      - Рейтинг
      - Количество игр
  expected-result: |
    - Раздел Профиль загружен без ошибок
    - Отображаются все элементы интерфейса
    - Персональные данные корректны:
      - Фото профиля отображается
      - Имя пользователя соответствует регистрационным данным
      - Дата регистрации корректна
      - Ранг отображается правильно
      - Рейтинг соответствует статистике
      - Количество игр соответствует реальной статистике
 
- summary: |
    Проверка функциональности раздела Настройки
  requirement: |
    Раздел Настройки должен обеспечивать:
    - Изменение персональных данных
    - Настройка уведомлений
    - Управление социальными сетями
    - Сохранение внесенных изменений
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему
  test-data: |
    Credentials:
      Email: registereduser@example.com
      Пароль: RegisteredPassword123
      New Name: qqqq123
  steps:
    - Открываем сайт
    - Переходим к странице входа
    - Вводим email: registereduser@example.com
    - Вводим пароль: RegisteredPassword123
    - Нажимаем кнопку «Войти»
    - Открываем меню профиля на главной странице
    - Нажимаем на пункт «Настройки»
    - Проверяем наличие следующих секций:
      - Персональные данные
      - Настройки уведомлений
      - Интеграция с социальными сетями
    - Вводим новое имя: qqqq123
    - Нажимаем кнопку «Сохранить изменения»
    - Перезаходим в систему:
      - Выходим из аккаунта
      - Входим снова с данными:
        - Email: registereduser@example.com
        - Пароль: RegisteredPassword123
    - Проверяем отображение нового имени
  expected-result: |
    - Все секции настроек доступны для редактирования
    - Новое имя успешно сохранено
    - Изменения отображаются после перезагрузки
    - Настройки уведомлений корректно переключаются
    - Интеграция с соц. сетями работает
    - После входа отображается новое имя: qqqq123
    
- summary: Проверка функциональности раздела "Рейтинг пользователей"
  requirements:
    - Раздел "Рейтинг пользователей" должен отображать список пользователей с рейтингами
    - Список должен быть отсортирован по убыванию рейтинга
    - Должна быть возможность просматривать подробную информацию о пользователе
    - Должна быть реализована пагинация или бесконечная прокрутка
  prerequisites:
    - Пользователь зарегистрирован на сайте
    - Пользователь успешно выполнил вход в систему
  test_data:
    credentials:
      email: registereduser@example.com
      password: RegisteredPassword123
  steps:
    - Открыть сайт
    - Перейти на страницу входа
    - Ввести email: registereduser@example.com
    - Ввести пароль: RegisteredPassword123
    - Нажать кнопку "Войти"
    - Открыть меню профиля на главной странице
    - Нажать на пункт "Рейтинг пользователей"
    - Проверить наличие следующих столбцов в таблице:
      - Ранг
      - Имя пользователя
      - Рейтинг
      - Количество игр
      - Дата регистрации
    - Проверить сортировку по убыванию рейтинга:
      - Убедиться, что первый пользователь имеет максимальный рейтинг
      - Проверить последовательность рейтингов по убыванию
    - Проверить работу пагинации/прокрутки:
      - Перейти на следующую страницу/прокрутить
      - Проверить корректность отображения данных
    - Проверить отображение информации при клике на пользователя:
      - Кликнуть на любого пользователя из списка
      - Проверить открытие профиля
  expected_result:
    - Таблица рейтинга загружена без ошибок
    - Все столбцы отображаются корректно
    - Данные отсортированы по убыванию рейтинга
    - Пагинация/прокрутка работает корректно:
      - Страницы переключаются без ошибок
      - Данные не дублируются
    - При клике на пользователя открывается его профиль:
      - Отображается подробная информация
      - Данные соответствуют данным в таблице рейтинга
    - Информация о пользователях актуальна:
      - Рейтинги соответствуют реальным
      - Даты регистрации корректны
      - Количество игр соответствует статистике

- summary: |
    Проверка функциональности раздела Упражнения
  requirement: |
    Раздел Упражнения должен обеспечивать:
    - Создание новых упражнений
    - Управление существующими упражнениями
    - Валидацию входных данных
    - Отображение списка упражнений
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему
  test-data: |
    Credentials:
      Email: registereduser@example.com
      Пароль: RegisteredPassword123
    Exercise Details:
      Название: Проверка статуса
      Сложность: Легкая
      Язык: Java
      Описание: "Напишите метод на Java, который принимает булево значение и возвращает строку 'Активно', если значение true, и 'Неактивно', если false"
      Примеры:
      - Ввод: true, Вывод: Активно
      - Ввод: false, Вывод: Неактивно
      - Ввод: true, Вывод: Активно
  steps:
    - Открываем сайт
    - Переходим к странице входа
    - Вводим email: registereduser@example.com
    - Вводим пароль: RegisteredPassword123
    - Нажимаем кнопку «Войти»
    - Открываем меню профиля на главной странице
    - Нажимаем на пункт «Упражнения»
    - Проверяем наличие разделов:
      - Создать упражнение
      - Пул упражнений
    - Переходим в раздел «Создать упражнение»
    - Заполняем форму создания упражнения:
      - В поле «Название» вводим: Проверка статуса
      - Выбираем сложность: Легкая
      - Выбираем язык: Java
      - Вводим описание
      - Добавляем входные/выходные параметры
      - Добавляем примеры
    - Нажимаем кнопку «Создать»
    - Проверяем создание упражнения:
      - Упражнение появляется в списке
      - Все данные корректно отображаются
    - Переходим в раздел «Пул упражнений»
    - Проверяем наличие созданного упражнения
  expected-result: |
    - Форма создания упражнения доступна
    - Все поля формы валидируются корректно
    - Упражнение успешно создается
    - Данные упражнения корректно отображаются
    - Упражнение появляется в пуле упражнений
    - Примеры тестов работают корректно

summary: |-
  Проверка функциональности создания турнира по программированию
requirement: |-
  Функционал создания турнира должен обеспечивать:
  - Создание турнира в командном режиме
  - Указание параметров турнира
  - Валидацию входных данных
  - Сохранение настроек турнира
  - Отображение турнира в списке
prerequisites:
  - Пользователь зарегистрирован на сайте
  - Выполнен вход в систему
  - У пользователя есть права на создание турниров
test-data:
  credentials:
    email: adminuser@example.com
    password: AdminPassword123
  tournament-details:
    title: Кубок кодинга
    type: Командный
    teams:
      - Команда Alpha
      - Команда Beta
    description: Турнир между двумя командами. Задачи средней сложности.
    start-time: '2023-11-15T14:00:00Z'
    settings:
      access: По токену
      gameplay-mode: Случайный раунд
      scoring-method: Выиграл или проиграл
      exercise-source: Пул упражнений
      difficulty: Средний
      number-of-players: 64
      language: Java
      timeout: 600
      break-duration: 300
      rounds-to-win: 3
steps:
  - Открываем сайт
  - Переходим к странице входа
  - Вводим email: adminuser@example.com
  - Вводим пароль: AdminPassword123
  - Нажимаем кнопку «Войти»
  - Открываем меню профиля
  - Нажимаем на пункт «Турниры»
  - Заполняем форму создания турнира:
    - Вводим название: Кубок кодинга
    - Выбираем тип: Командный
    - Добавляем команды: Команда Alpha, Команда Beta
    - Вводим описание: Турнир между двумя командами. Задачи средней сложности.
    - Устанавливаем время начала: 2023-11-15T14:00:00Z
    - Выбираем настройки доступа: По токену
    - Настраиваем ход игры: Случайный раунд
    - Настраиваем оценку игры: Выиграл или проиграл
    - Выбираем источник упражнений: Пул упражнений
    - Устанавливаем сложность: Средний
    - Указываем количество игроков: 64
    - Выбираем язык программирования: Java
    - Устанавливаем таймаут: 600 секунд
    - Указываем длительность перерыва: 300 секунд
    - Настраиваем раунды до победы: 3
  - Нажимаем кнопку «Создать»
  - Проверяем создание турнира:
    - Турнир отображается в списке
    - Открываем детальную информацию
    - Проверяем корректность всех параметров
expected-result:
  - Форма создания турнира доступна
  - Все поля валидируются корректно
  - Турнир успешно создается
  - Настройки корректно сохраняются
  - Турнир отображается в списке
  - Детальная информация соответствует введенным данным

summary: |-
  Проверка работы формы обратной связи
requirement: |-
  Форма обратной связи должна обеспечивать:
  - Выбор категории обращения
  - Ввод текстового сообщения
  - Валидацию обязательных полей
  - Отправка данных на сервер
  - Отображение результата отправки
prerequisites:
  - Пользователь находится на странице с формой обратной связи
  - Форма доступна для взаимодействия
test-data:
  category: Улучшения
  message-text: Предлагаю добавить возможность фильтрации задач по сложности
steps:
  - Открываем сайт
  - Переходим на страницу с формой обратной связи
  - Проверяем наличие обязательных полей:
    - Категория обращения
    - Поле для текста
    - Кнопка отправки
  - Выбираем категорию "Улучшения" из выпадающего списка
  - Вводим текст сообщения
  - Нажимаем кнопку "Отправить"
  - Проверяем появление подтверждающего сообщения
expected-result:
  - Форма загружается без ошибок
  - Все поля доступны для ввода
  - Сообщение успешно отправляется
  - Появляется подтверждающее сообщение
  - Данные в форме очищаются
