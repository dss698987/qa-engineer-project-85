---
- summary: |
    Проверка регистрации нового пользователя с уникальным email и паролем
  requirement: |
    Пользователи могут регистрироваться на сайте с использованием уникального email и пароля
  prerequisites: |
    Открыта страница регистрации
  test-data: |
    - Email: newuser@example.com
    - Пароль: NewPassword123
  steps:
    - Вводим email: newuser@example.com
    - Вводим пароль: NewPassword123
    - Подтверждаем пароль: NewPassword123
    - Нажимаем кнопку «Зарегистрироваться»
  expected-result: |
    Пользователь успешно зарегистрирован и перенаправлен на страницу входа или профиля
    
- summary: |
    Проверка входа на сайт через учетные данные Git или Discord
  requirement: |
    Пользователи могут авторизоваться на сайте с использованием внешних провайдеров аутентификации (Git или Discord).
  prerequisites: |
    - Открыта страница входа
    - У пользователя есть учетная запись Git или Discord
    - На странице входа присутствуют кнопки 'Войти через Git' и 'Войти через Discord'
    - Сайт настроен для интеграции с Git и Discord
  test-data: |
    Git:
      - Имя пользователя: gituser123
      - Пароль: GitPassword456
    Discord:
      - Учетная запись с правами авторизации через OAuth
  steps:
    - Открываем сайт и переходим к странице входа
    - Нажимаем кнопку «Войти через Git»
    - Вводим имя пользователя: gituser123
    - Вводим пароль: GitPassword456
    - Нажимаем кнопку «Авторизоваться» для Git
    - Нажимаем кнопку «Войти через Discord»
    - В модальном окне разрешаем приложению доступ к данным аккаунта Discord
    - Подтверждаем авторизацию для Discord
    - Проверяем перенаправление на главную страницу
    - Проверяем отображение имени пользователя или аватара
  expected-result: |
    - Пользователь успешно авторизован через выбранный провайдер (Git или Discord)
    - Перенаправление на главную страницу сайта
    - На главной странице отображается имя пользователя или его аватар
    - Сессия пользователя активна
    - Возможность взаимодействия с сайтом
    
- summary: |
    Проверка запуска игры авторизованным пользователем с главной страницы
  requirement: |
    Авторизованные пользователи могут запустить игру с главной страницы
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему с email: registereduser@example.com и паролем: RegisteredPassword123
    - Пользователь находится на главной странице
    - На странице присутствует кнопка "Create Game"
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
    - Game Name: "Название_Игры"
    - Level: Medium
    - Game Mode: Bot
    - Time Control: 10 минут
    - Task: Tomato
  steps:
    - Нажимаем кнопку "Create Game"
    - Вводим название игры: "Название_Игры"
    - Выбираем уровень: Medium
    - Выбираем режим игры: Bot
    - Устанавливаем время: 10 минут
    - Выбираем тематику: Tomato
    - Нажимаем кнопку "Create Battle"
  expected-result: |
    Игра успешно запущена с настройками:
    - Название: "Название_Игры"
    - Уровень: Medium
    - Режим: Bot
    - Время: 10 минут
    - Тематика: Tomato
    Интерфейс игры отображается корректно, элементы управления (поле, счет, таймер) работают

- summary: |
    Проверка работы чата на главной странице
  requirement: |
    Чат на главной странице должен обеспечивать:
    - Обмен текстовыми сообщениями
    - Отображение статусов пользователей
    - Отправка файлов
    - Уведомления о новых сообщениях
    - Корректное отображение сообщений
  prerequisites: |
    - Пользователь зарегистрирован
    - Выполнен вход в систему с email: registereduser@example.com и паролем: RegisteredPassword123
    - Открыта главная страница
    - Чат виден на странице
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
    - Message: "Привет, это тестовое сообщение!"
  steps:
    - Вводим сообщение: "Привет, это тестовое сообщение!"
    - Нажимаем кнопку «Отправить»
  expected-result: |
    Чат работает корректно с настройками:
    - Сообщение: "Привет, это тестовое сообщение!"
    - Временная метка отображается
    - Аватар пользователя виден
    - Статус сообщения обновляется до "Прочитано"
    - Уведомление о новом сообщении появляется
    
- summary: |
    Проверка функциональности раздела Профиль
  requirement: |
    Раздел Профиль должен обеспечивать:
    - Просмотр персональной информации пользователя
    - Корректное отображение всех данных профиля
    - Возможность редактирования профиля
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему с email: registereduser@example.com и паролем: RegisteredPassword123
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
    - New Name: "UpdatedUser"
  steps:
    - Открываем меню профиля
    - Нажимаем пункт «Мой профиль»
    - Нажимаем кнопку «Редактировать профиль»
    - Вводим новое имя: "UpdatedUser"
    - Нажимаем кнопку «Сохранить»
  expected-result: |
    Профиль работает корректно:
    - Персональные данные отображаются
    - Фото профиля видно
    - Имя пользователя обновлено до "UpdatedUser"
    - Дата регистрации корректна
    - Ранг и рейтинг отображаются
    - Количество игр соответствует статистике
 
- summary: |
    Проверка функциональности раздела Настройки
  requirement: |
    Раздел Настройки должен обеспечивать:
    - Изменение персональных данных
    - Настройка уведомлений
    - Управление социальными сетями
    - Сохранение внесенных изменений
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему с email: registereduser@example.com и паролем: RegisteredPassword123
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
    - New Name: qqqq123
  steps:
    - Открываем меню профиля
    - Нажимаем пункт «Настройки»
    - Вводим новое имя: qqqq123
    - Включаем уведомления по email
    - Подключаем Discord
    - Нажимаем кнопку «Сохранить изменения»
  expected-result: |
    Настройки работают корректно:
    - Имя обновлено до qqqq123
    - Уведомления по email включены
    - Discord подключен
    - Изменения сохранены и отображаются
    
- summary: |
    Проверка функциональности раздела "Рейтинг пользователей"
  requirement: |
    - Раздел "Рейтинг пользователей" должен отображать список пользователей с рейтингами
    - Список должен быть отсортирован по убыванию рейтинга
    - Должна быть возможность просматривать подробную информацию о пользователе
    - Должна быть реализована пагинация или бесконечная прокрутка
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
  steps:
    - Открываем меню профиля
    - Нажимаем пункт "Рейтинг пользователей"
    - Переходим на следующую страницу пагинации
    - Кликаем на пользователя из списка
  expected-result: |
    Рейтинг пользователей работает корректно:
    - Список отсортирован по убыванию рейтинга
    - Отображаются ранг, имя, рейтинг, игры, дата регистрации
    - Пагинация переключает страницы
    - Профиль пользователя открывается с подробной информацией

- summary: |
    Проверка функциональности раздела Упражнения
  requirement: |
    Раздел Упражнения должен обеспечивать:
    - Создание новых упражнений
    - Управление существующими упражнениями
    - Валидацию входных данных
    - Отображение списка упражнений
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему с email: registereduser@example.com и паролем: RegisteredPassword123
  test-data: |
    - Email: registereduser@example.com
    - Пароль: RegisteredPassword123
    - Название: Проверка статуса
    - Сложность: Легкая
    - Язык: Java
    - Описание: "Напишите метод на Java, который принимает булево значение и возвращает строку 'Активно', если значение true, и 'Неактивно', если false"
  steps:
    - Открываем меню профиля
    - Нажимаем пункт «Упражнения»
    - Переходим в «Создать упражнение»
    - Вводим название: Проверка статуса
    - Выбираем сложность: Легкая
    - Выбираем язык: Java
    - Вводим описание: "Напишите метод на Java, который принимает булево значение и возвращает строку 'Активно', если значение true, и 'Неактивно', если false"
    - Нажимаем кнопку «Создать»
  expected-result: |
    Упражнения работают корректно:
    - Упражнение создано с названием "Проверка статуса"
    - Сложность: Легкая
    - Язык: Java
    - Описание отображается корректно
    - Упражнение видно в пуле
    
- summary: |
    Проверка функциональности создания турнира по программированию
  requirement: |
    Функционал создания турнира должен обеспечивать:
    - Создание турнира в командном режиме
    - Указание параметров турнира
    - Валидацию входных данных
    - Сохранение настроек турнира
    - Отображение турнира в списке
  prerequisites: |
    - Пользователь зарегистрирован на сайте
    - Выполнен вход в систему с email: adminuser@example.com и паролем: AdminPassword123
    - У пользователя есть права на создание турниров
    - Открыта главная страница
  test-data: |
    - Email: adminuser@example.com
    - Пароль: AdminPassword123
    - Title: Кубок кодинга
    - Type: Командный
    - Teams: Команда Alpha, Команда Beta
    - Description: Турнир между двумя командами. Задачи средней сложности.
    - Start Time: '2025-03-01T14:00:00Z'
    - Access: По токену
    - Gameplay Mode: Случайный раунд
    - Scoring Method: Выиграл или проиграл
    - Exercise Source: Пул упражнений
    - Difficulty: Средний
    - Number of Players: 64
    - Language: Java
    - Timeout: 600
    - Break Duration: 300
    - Rounds to Win: 3
  steps:
    - Открываем меню профиля
    - Нажимаем пункт «Турниры»
    - Вводим название: Кубок кодинга
    - Выбираем тип: Командный
    - Добавляем команды: Команда Alpha, Команда Beta
    - Вводим описание: Турнир между двумя командами. Задачи средней сложности.
    - Устанавливаем время начала: 2025-03-01T14:00:00Z
    - Выбираем доступ: По токену
    - Настраиваем ход игры: Случайный раунд
    - Настраиваем оценку: Выиграл или проиграл
    - Выбираем источник упражнений: Пул упражнений
    - Устанавливаем сложность: Средний
    - Указываем количество игроков: 64
    - Выбираем язык: Java
    - Устанавливаем таймаут: 600 секунд
    - Устанавливаем перерыв: 300 секунд
    - Настраиваем раунды до победы: 3
    - Нажимаем кнопку «Создать»
  expected-result: |
    Турнир создан корректно:
    - Название: Кубок кодинга
    - Тип: Командный
    - Команды: Команда Alpha, Команда Beta
    - Описание: Турнир между двумя командами. Задачи средней сложности.
    - Время начала: 2025-03-01T14:00:00Z
    - Настройки: По токену, Случайный раунд, Выиграл или проиграл, Пул упражнений, Средний, 64 игрока, Java, 600 секунд, 300 секунд перерыва, 3 раунда
    - Турнир отображается в списке

- summary: |
    Проверка работы формы обратной связи
  requirement: |
    Форма обратной связи должна обеспечивать:
    - Выбор категории обращения
    - Ввод текстового сообщения
    - Валидацию обязательных полей
    - Отправка данных на сервер
    - Отображение результата отправки
  prerequisites: |
    - Пользователь находится на странице с формой обратной связи
    - Форма доступна для взаимодействия
  test-data: |
    - Category: Улучшения
    - Message Text: Предлагаю добавить возможность фильтрации задач по сложности
  steps:
    - Выбираем категорию: Улучшения
    - Вводим сообщение: Предлагаю добавить возможность фильтрации задач по сложности
    - Нажимаем кнопку «Отправить»
  expected-result: |
    Форма обратной связи работает корректно:
    - Категория: Улучшения
    - Сообщение: Предлагаю добавить возможность фильтрации задач по сложности
    - Сообщение отправлено
    - Появляется подтверждение отправки
    - Ошибка валидации отображается при пустом поле
